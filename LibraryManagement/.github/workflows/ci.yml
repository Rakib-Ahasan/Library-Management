name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore LibraryManagement.sln
      - name: Build
        run: dotnet build LibraryManagement.sln --no-restore -warnaserror
      - name: Test
        run: dotnet test LibraryManagement.sln --no-build --collect:"XPlat Code Coverage"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
